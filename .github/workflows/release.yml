name: Release

on:
  push:
    branches: [release]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  # e.g. rstakaiito/sverse-be-v3-prd — must match the image in the server's docker-compose.yml
  IMAGE: ${{ vars.DOCKER_IMAGE_NAME }}

jobs:
  test:
    name: Test (unit, integration, invariants)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test

  build:
    name: Build & push image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: ENV=production
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy (production)
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            cd /data/docker/sverse/backend/
            echo "Pulling latest image..."
            sudo docker-compose pull
            echo "Recreating containers..."
            sudo docker-compose up -d
            sudo docker image prune -f
