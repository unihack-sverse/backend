services:
  mongo:
    image: mongo:7
    container_name: sverse-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7
    container_name: sverse-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("replica set already initiated");
          } catch (e) {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]});
            print("replica set initiated");
          }
        '
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: sverse-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mongo-express:
    image: mongo-express:1.0
    container_name: sverse-mongo-express
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/sverse?replicaSet=rs0&directConnection=true"
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_SITE_BASEURL: "/"
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  mongo-data:
  redis-data:
